# BAND 1.21: Fabric and NeoForge 1.21 to 1.21.1.
# Compiled against 1.21, the OLDEST version served: an API added mid range fails at runtime,
# not at build time. Both ends are hard walls: Fabric's HudRenderCallback changes at 1.21, and
# GuiGraphics.blit changes shape at 1.21.2 (a RenderType function and a colour, setColor
# gone), with no form on both sides.
loaders=fabric,neoforge
eras=1.21

minecraft_version=1.21
minecraft_version_range=[1.21, 1.21.2)
fabric_minecraft_version_range=>=1.21 <1.21.2
# Jars are named after the NEWEST version they serve.
minecraft_version_label=1.21.1

neo_form_version=1.21-20240613.152323
parchment_minecraft=1.21
parchment_version=2024.11.10

fabric_version=0.102.0+1.21
fabric_loader_version=0.15.11


neoforge_version=21.0.167
neoforge_version_range=[21.0, 21.2)

# Cloth ships a different major per Minecraft version, so ranges stay permissive.
cloth_config_version=15.0.140
mod_menu_version=11.0.4

pack_format=34
