# BAND 1.21: Fabric, NeoForge and Forge 1.21 to 1.21.1 (Forge 1.21.1 only).
# Compiled against 1.21, the OLDEST version served: an API added mid range fails at runtime,
# not at build time. Both ends are hard walls: Fabric's HudRenderCallback changes at 1.21, and
# GuiGraphics.blit changes shape at 1.21.2 (a RenderType function and a colour, setColor
# gone), with no form on both sides, so the title image needs its own band from 1.21.2.
loaders=fabric,neoforge,forge
eras=1.21,1.21-1.21.2,1.21-1.21.6

minecraft_version=1.21
minecraft_version_range=[1.21, 1.21.2)
fabric_minecraft_version_range=>=1.21 <1.21.2
# Jars are named after the NEWEST version they serve.
minecraft_version_label=1.21.1
fabric_minecraft_version_label=1.21.1

neo_form_version=1.21-20240613.152323
parchment_minecraft=1.21
parchment_version=2024.11.10

fabric_version=0.102.0+1.21
fabric_loader_version=0.15.11

# FORGE IS 1.21.1 ONLY. Forge 51 (1.21) has no HUD overlay API; it appears in Forge 52.1.2
# exactly (52.1.1 lacks it), bisected through the universal jars. So the Forge module
# compiles against 1.21.1 and its range has a real floor.
forge_minecraft_version=1.21.1
forge_minecraft_version_range=[1.21.1, 1.21.2)
forge_minecraft_version_label=1.21.1
forge_version=52.1.2
forge_version_range=[52.1.2,)
forge_loader_version_range=[52,)
# Official Cloth ships a Forge build at 1.21.1.
forge_cloth_artifact=me.shedaniel.cloth:cloth-config-forge:15.0.140

neoforge_version=21.0.167
neoforge_version_range=[21.0, 21.2)

# Cloth ships a different major per Minecraft version, so ranges stay permissive.
cloth_config_version=15.0.140
mod_menu_version=11.0.4

pack_format=34
