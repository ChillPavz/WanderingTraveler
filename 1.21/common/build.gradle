plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// Code and resources that are identical in every band live once, in the repository's shared/
// folder: the title timing, the config holder and the platform plumbing, plus the art, the
// fonts, the icon and the lang file. Every loader takes them alongside this module's own.
sourceSets.main.java.srcDir('../../shared/java')

// The repository's narrower shared/ folders: per loader, and per group of bands (shared/eras).
apply from: '../../shared/gradle/shared-sources.gradle'

// Every source folder is published on its own: src/main, this band's era folders and
// shared/java. The template's sourceDirectories.singleFile throws once there is more than one.
artifacts {
    sourceSets.main.java.srcDirs.findAll { it.exists() }.each { commonJava it }
    sourceSets.main.resources.srcDirs.findAll { it.exists() }.each { commonResources it }
    commonResources file('../../shared/resources')
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
