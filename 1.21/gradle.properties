# Everything that changes with Minecraft lives in versions/<band>.properties, picked with -Pmc,
# and is deliberately NOT here, so a stale value can never shadow it. See settings.gradle.
# Every field used in a metadata file must also be in the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle, or it expands to nothing.

# Project
version=1.5.0
group=com.chillpavz.wanderingtraveler
java_version=21

# Common
mod_name=Wandering Traveler
mod_author=chillpavz
mod_id=wanderingtraveler
license=All Rights Reserved
credits=
description=RPG-style biome titles, with hand-made 3D artwork instead of plain text.

# NeoForge's loader floor is FML 4 for every 1.21.x build
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
