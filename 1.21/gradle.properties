# Every field added here must also be added to the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle, or it expands to nothing.

# Project
version=1.5.0
group=com.chillpavz.wanderingtraveler
java_version=21

# Common
# COMPILED AGAINST 1.21.6, THE OLDEST VERSION IN THE BAND, per the rule that using an API
# added mid range fails at RUNTIME rather than at build time.
minecraft_version=1.21
mod_name=Wandering Traveler
mod_author=chillpavz
mod_id=wanderingtraveler
license=All Rights Reserved
credits=
description=RPG-style biome titles, with hand-made 3D artwork instead of plain text.

# THIS BAND IS 1.21 THROUGH 1.21.5, AND BOTH ENDS ARE HARD WALLS.
#
# It STARTS at 1.21 because Fabric's HudRenderCallback takes (GuiGraphics, float) at 1.20.x
# and (GuiGraphics, DeltaTracker) from 1.21.
#
# It ENDS at 1.21.5 because GuiGraphics.pose() returns a PoseStack here and a JOML
# Matrix3x2fStack from 1.21.6, which is a hard break on every loader. So unlike the band
# above, Fabric gets no free extra versions: the wall is in Minecraft's own API rather than
# in a class NAME, and intermediary hides renames, not signature changes.
minecraft_version_range=[1.21, 1.21.6)
## Forge stops at 1.21.1: official Cloth Config has no Forge build above it in this
## band, and nothing else provides one there.
forge_minecraft_version_range=[1.21.1, 1.21.2)
fabric_minecraft_version_range=>=1.21 <1.21.6
## Jars are named after the NEWEST version they serve, per the naming rule. The
## NeoForge and Forge jars stop at 1.21.10; the Fabric one reaches 1.21.11.
minecraft_version_label=1.21.5
forge_minecraft_version_label=1.21.1
fabric_minecraft_version_label=1.21.5

# 1.21.6 is still OBFUSCATED - de-obfuscation lands at 26.1 - so this branch needs a
# mappings layer, which the template's Parchment setup provides.
neo_form_version=1.21-20240613.152323
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.102.0+1.21
fabric_loader_version=0.15.11

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/ for new versions
# FORGE IS 1.21.1 ONLY ON THIS BRANCH, AND THAT IS A CAPABILITY LIMIT, NOT A CHOICE.
# Forge 51 (1.21) ships NO HUD overlay API at all: no AddGuiOverlayLayersEvent, no
# client.gui.overlay package, nothing equivalent among its client events, so a HUD layer
# cannot be added there without a mixin. Checked against the newest 1.21 build, 51.0.33.
# The API appears at 1.21.1 in Forge 52.1.2 exactly, bisected through the universal jars:
# 52.1.1 does not have it and 52.1.2 does.
#
# So the Forge module compiles against 1.21.1 while common, fabric and neoforge compile
# against 1.21, and its accepted range has a real FLOOR rather than the usual open one.
# That floor is the documented exception to "never pin to a build number": builds below it
# genuinely lack the API rather than merely being older.
forge_minecraft_version=1.21.1
forge_version=52.1.2
forge_version_range=[52.1.2,)
forge_loader_version_range=[52,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.0.167
neoforge_loader_version_range=[4,)
## Spans the whole band: NeoForge numbers its builds <mc>.<build>, so 21.6 through 21.10.
neoforge_version_range=[21.0, 21.6)

# Dependencies
# CLOTH SHIPS THREE MAJORS ACROSS THIS BAND: 19.0.x at 1.21.6-1.21.8, 20.0.x at
# 1.21.9-1.21.10 and 21.11.x at 1.21.11. So the declared dependency must be a permissive
# RANGE and never a pin, and the code must call AutoConfig rather than AutoConfigClient,
# which does not exist below 21.11.x. Compiled against the oldest, 19.0.147.
cloth_config_version=15.0.140
mod_menu_version=11.0.4

# Resource pack format for 1.21.6, read from version.json in the client jar
pack_format=34

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
