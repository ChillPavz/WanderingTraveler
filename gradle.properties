# Every field added here must also be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle, or it expands to nothing.

# Project
version=1.0.0
group=com.chillpavz.wanderingtraveler
java_version=25

# Common
minecraft_version=26.2
mod_name=Wandering Traveler
mod_author=chillpavz
mod_id=wanderingtraveler
license=All Rights Reserved
credits=
description=RPG-style biome titles, with hand-made 3D artwork instead of plain text.
# ONE JAR FOR 26.1 THROUGH 26.2, and that is verified rather than hoped: every
# Minecraft, Fabric API, NeoForge and Cloth member this mod touches was diffed between
# the 26.1.2 and 26.2 jars and comes back identical, including the public surface of
# ClothConfigScreen (only a private field differs there).  So compiling against 26.2 and
# declaring back to 26.1 cannot reach an API that the older version lacks.
# The jar is NAMED after the line rather than the build version, per the umbrella's rule
# for a file that covers a whole patch line.
minecraft_version_range=[26.1, 26.3)
# Fabric cannot parse Maven bracket ranges, so the same range is duplicated in semver.
fabric_minecraft_version_range=>=26.1 <26.3
minecraft_version_label=26.x
neo_form_version=26.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.152.1+26.2
fabric_loader_version=0.19.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.1-beta
neoforge_loader_version_range=[4,)
# Pinning the neoforge dep to a build number refuses every OLDER build of the same
# Minecraft version, which is the trap the umbrella notes call out; use the MC range.
# NeoForge numbers its builds <mc>.<build>, so 26.1.2.7-beta sorts inside this and a
# pin to 26.2.0.1-beta would have refused every 26.1 build before the range was read.
neoforge_version_range=[26.1, 26.3)

# Dependencies
cloth_config_version=26.2.155
mod_menu_version=20.0.1

# Resource and data pack formats for 26.2, read from version.json in the client jar
pack_format=88

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
