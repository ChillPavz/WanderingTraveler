# Every field added here must also be added to the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle, or it expands to nothing.

# Project
version=1.5.0
group=com.chillpavz.wanderingtraveler
java_version=21

# Common
minecraft_version=1.21.11
mod_name=Wandering Traveler
mod_author=chillpavz
mod_id=wanderingtraveler
license=All Rights Reserved
credits=
description=RPG-style biome titles, with hand-made 3D artwork instead of plain text.
# This jar is for 1.21.11 alone. The band below it (1.21.6 through 1.21.10) is a separate
# branch, because Style.withFont takes a ResourceLocation there and a FontDescription here,
# and because NeoForge and Forge cannot cross the ResourceLocation to Identifier rename at
# all - only Fabric can, through intermediary.
minecraft_version_range=[1.21.11, 1.22)
# Fabric cannot parse Maven bracket ranges, so the same range is duplicated in semver.
fabric_minecraft_version_range=>=1.21.11 <1.22
neo_form_version=1.21.11-20251209.172050
# 1.21.11 is still OBFUSCATED - de-obfuscation lands at 26.1 - so unlike the 26.x branch
# this one needs a mappings layer, and the template's Parchment setup provides it.
parchment_minecraft=1.21.11
parchment_version=2025.12.20

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.141.6+1.21.11
fabric_loader_version=0.18.2

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/ for new versions
forge_version=61.0.1
## Accepted Forge builds. NEVER "[${forge_version},)" - that refuses every older build of
## the same Minecraft version, which is the trap the umbrella notes call out.
forge_version_range=[61,)
forge_loader_version_range=[61,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.11.3-beta
neoforge_loader_version_range=[4,)
## NeoForge numbers its builds <mc>.<build>, so a pin to a build number sorts wrongly and
## refuses older builds of the same Minecraft version. Range on the Minecraft line instead.
neoforge_version_range=[21.11, 21.12)

# Dependencies
# Cloth ships a different MAJOR per Minecraft version, so this is a pin rather than a range.
# Official cloth has NO Forge build at 1.21.11 (it stops at 1.21.3), so the Forge module uses
# the unofficial cloth-config-forge, which is shedaniel's own forge module rebuilt: same
# version number, same API, different Modrinth project. Players on Forge install THAT one.
cloth_config_version=21.11.153
mod_menu_version=17.0.0

# Resource pack format for 1.21.11, read from version.json in the client jar
pack_format=75

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
