pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'MultiLoader-Template'
include('common')
include('fabric')
include('neoforge')
// FORGE IS NOT BUILT ON THIS BRANCH, and it is not an oversight. Forge 56 (1.21.6) has NO
// HUD overlay API at all: no AddGuiOverlayLayersEvent, no client.gui.overlay package, and
// nothing equivalent among its client events, so a HUD layer cannot be added there without
// a mixin. This mod has none on purpose. The API exists by Forge 61 (1.21.11), which is
// why Forge ships on that branch. If it turns out to arrive partway through the band, a
// narrower Forge jar becomes possible; re-add the include then.
// include('forge')