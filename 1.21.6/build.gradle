plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.13-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.123' apply false
}

// Cloth Config and Mod Menu are the config screen's two dependencies; neither is on
// Maven Central. Cloth's mod id is `cloth_config` and it PROVIDES `cloth-config2`,
// which is why the Fabric metadata depends on one spelling and the loader TOMLs on
// the other.
//
// At 1.21.11 official cloth has NO Forge build, so the Forge module pulls the same
// coordinates from the unofficial cloth-config-forge instead; see forge/build.gradle.
allprojects {
    repositories {
        maven {
            name = 'shedaniel'
            url = uri('https://maven.shedaniel.me/')
        }
        maven {
            name = 'TerraformersMC'
            url = uri('https://maven.terraformersmc.com/')
        }
    }
}
