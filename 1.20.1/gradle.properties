# Every field added here must also be added to the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle, or it expands to nothing.

# Project
version=1.5.0
group=com.chillpavz.wanderingtraveler
## Mojang requires Java 17 at this Minecraft version, so the jar must be class-file major 61.
## NOTE this is NOT the JDK you build with: Gradle 8.11 plus ModDevGradle needs JDK 22.
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Wandering Traveler
mod_author=chillpavz
mod_id=wanderingtraveler
license=All Rights Reserved
credits=
description=RPG-style biome titles, with hand-made 3D artwork instead of plain text.

# THIS BAND IS 1.20 AND 1.20.1, AND THE UPPER BOUND IS A HARD WALL.
#
# It ENDS below 1.20.2 because Fabric's HudRenderCallback takes (GuiGraphics, float) here
# and (GuiGraphics, DeltaTracker) from 1.21, and because 1.20.2 rewrote networking and
# moved the data folders. It is also where the loaders start to diverge: NeoForge becomes
# a separate module from 1.20.2, and Forge crosses three more majors up the line.
#
# 1.20.2 through 1.20.6 are ~4.3% of the ecosystem between them with no single version
# above 1.82%, against 16.02% for these two, so the rest of the line is deliberately not
# served. Measured, not assumed.
minecraft_version_range=[1.20, 1.20.2)
## Fabric semver equivalent of the above. Fabric CANNOT parse the Maven bracket form.
fabric_minecraft_version_range=>=1.20 <1.20.2
## Jars are named after the NEWEST version they serve, per the naming rule.
minecraft_version_label=1.20.1

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric, see https://fabricmc.net/develop/ for new versions
# COMPILED AGAINST THE 1.20.1 BUILD, and there is no separate 1.20 one to worry about:
# fabric-api ships a different FILE per version (0.83.0+1.20, 0.92.x+1.20.1) but the four
# entry points this mod uses are byte-identical in both - HudRenderCallback
# (GuiGraphics, float), ClientTickEvents.END_CLIENT_TICK, ResourceManagerHelper
# .registerReloadListener and IdentifiableResourceReloadListener.getFabricId. Checked by
# javap against both jars rather than assumed, because the metadata says "fabric-api": "*"
# and a 1.20 player therefore installs the older one.
fabric_version=0.92.2+1.20.1
fabric_loader_version=0.16.9

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/ for new versions
# ONE FORGE JAR COVERS 1.20 AND 1.20.1, AND IT IS ALSO THE NEOFORGE JAR.
# NeoForge at these versions is 47.1.x, a soft fork still on net.minecraftforge packages
# that PROVIDES the `forge` mod id, so the same file loads on both and the upload should be
# tagged for both. Forge 46 is 1.20 and 47 is 1.20.1, so [46,48) is exactly this jar's two
# versions - never "[${forge_version},)", which would refuse every build older than the one
# compiled against.
#
# Both majors carry the HUD API this mod needs (RegisterGuiOverlaysEvent, IGuiOverlay and
# VanillaGuiOverlay.TITLE_TEXT), verified by javap against the 46.0.14 and 47.2.30
# universal jars. That is a different API from every other branch: the ForgeLayeredDraw
# form used at 1.21.1 does not arrive until Forge 52.1.2.
forge_version=47.2.30
forge_version_range=[46,48)
forge_loader_version_range=[46,)

# Dependencies
# CLOTH 11.1.136 SHIPS ONE FABRIC AND ONE FORGE FILE, EACH COVERING BOTH 1.20 AND 1.20.1,
# so a single version serves the whole band and the code calls AutoConfig.getConfigScreen,
# which is present on every cloth from 11.1.136 up to 21.11.153. AutoConfigClient, which
# the 26.x branch uses, does not exist here.
#
# CLOTH IS AN OPTIONAL DEPENDENCY ON THIS BAND, unlike every other branch, and that is
# forced rather than preferred: cloth has NO neoforge-tagged file at 1.20 or 1.20.1, so a
# player who ticks NeoForge on Modrinth is never offered it and the launcher cannot install
# it for them. With cloth required, that player's game refuses to start. The mod now
# degrades to "no config screen" instead.
cloth_config_version=11.1.136
mod_menu_version=7.2.2

# Resource pack format for 1.20.1, read from version.json inside the client jar
# (pack_version.resource). 1.20 is 15 as well.
#
# 1.20.x knows ONLY pack_format: supported_formats arrives at 1.21 and min_format/max_format
# later still, so the four-field form the newer branches ship would be inert here.
pack_format=15

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
