plugins {
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

// Cloth Config and Mod Menu are the config screen's two dependencies; neither is on
// Maven Central. Cloth's mod id is `cloth_config` and it PROVIDES `cloth-config2`,
// which is why the Fabric metadata depends on one spelling and the NeoForge toml on
// the other.
allprojects {
    repositories {
        maven {
            name = 'shedaniel'
            url = uri('https://maven.shedaniel.me/')
        }
        maven {
            name = 'TerraformersMC'
            url = uri('https://maven.terraformersmc.com/')
        }
    }
}
