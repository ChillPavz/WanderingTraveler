modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
logoFile = "assets/${mod_id}/icon.png" #optional
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)

# NOTE: classic Forge uses `mandatory = true/false` here. `type = "required"` is NeoForge's
# syntax and makes Forge reject the jar outright with
# "Missing required field mandatory in dependency".
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# Cloth Config, for the settings screen. OPTIONAL on every Forge build: official cloth
# ships Forge files at 1.20.1 and 1.21.1 only, and from 1.21.5 up the Forge build is the
# unofficial cloth-config-forge port (same mod id, separate project). One store listing
# cannot name the right one per version, so both are listed as optional and the mod runs
# on its defaults, with no config screen, when neither is installed. See ClothCompat.
[[dependencies.${mod_id}]]
modId = "cloth_config"
mandatory = false
versionRange = "[1,)"
ordering = "AFTER"
side = "CLIENT"
