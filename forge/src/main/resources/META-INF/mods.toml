modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
logoFile = "assets/${mod_id}/icon.png" #optional
credits = "${credits}" #optional
authors = "${mod_author}" #optional
# The mod is client only, so a server that does not have it is not a mismatch. Without
# this the mods list marks every server incompatible. Forge 46 and 47 both read the key
# and both accept this value, checked against ModContainer in their own fmlcore jars.
displayTest = "IGNORE_ALL_VERSION"
description = '''${description}''' #mandatory (Supports multiline text)

# NOTE: classic Forge uses `mandatory = true/false` here. `type = "required"` is NeoForge's
# syntax and makes Forge reject the jar outright with
# "Missing required field mandatory in dependency".
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# CLOTH IS OPTIONAL ON THIS BAND, AND ON THIS BAND ALONE.
#
# It has no neoforge-tagged file at 1.20 or 1.20.1 - only fabric and forge - and this jar
# is the NeoForge jar as well, because NeoForge 47.1.x provides the `forge` mod id. A
# NeoForge player is therefore never offered cloth and the launcher cannot install it for
# them, so a required dependency would refuse to start their game. With it optional the
# mod runs and the Config button simply goes nowhere.
#
# Forge players CAN install it: point them at cloth's own Forge file on the store page.
[[dependencies.${mod_id}]]
modId = "cloth_config"
mandatory = false
versionRange = "[${cloth_config_version},)"
ordering = "AFTER"
side = "CLIENT"
