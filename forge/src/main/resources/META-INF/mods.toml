modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
logoFile = "assets/${mod_id}/icon.png" #optional
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)

# NOTE: classic Forge uses `mandatory = true/false` here. `type = "required"` is NeoForge's
# syntax and makes Forge reject the jar outright with
# "Missing required field mandatory in dependency".
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# Cloth Config, for the settings screen. Official cloth ships NO Forge build at this
# Minecraft version, so Forge players need the unofficial cloth-config-forge port, which
# carries the same mod id and the same version number. NAME IT ON THE STORE PAGE: the
# launcher cannot auto install it from this dependency alone, because the two are separate
# projects on Modrinth.
[[dependencies.${mod_id}]]
modId = "cloth_config"
mandatory = true
versionRange = "[1,)"
ordering = "AFTER"
side = "CLIENT"
